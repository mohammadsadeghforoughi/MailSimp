name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            command: npm run pack:linux
            artifact: MailSimp-linux-x64
          - name: Windows x64
            os: windows-latest
            command: npm run pack:win
            artifact: MailSimp-windows-x64
          - name: macOS (Apple Silicon and Intel)
            os: macos-latest
            command: npm run pack:mac
            artifact: MailSimp-macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm test
      - name: Build packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.command }}
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/MailSimp-*.AppImage
            release/MailSimp-*.deb
            release/MailSimp-*.exe
            release/MailSimp-*.dmg
            release/MailSimp-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum MailSimp-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --title "MailSimp ${GITHUB_REF_NAME}"
